<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CORRECTORS — Plateforme de correction par IA</title>
    <meta name="description" content="Onze correcteurs de copies par matière, assistés par IA, et un assistant de préparation de cours. Espace personnel sécurisé pour les enseignants." />

    <!-- Icônes. Sans ces balises le navigateur demande /favicon.ico, que le
         catch-all SPA sert en index.html (HTTP 200, text/html) : l'image est
         invalide et l'onglet retombe sur l'icône générique du navigateur. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Aperçu au partage du lien (messageries, réseaux). Sans og:image, la
         plupart des clients retombent sur la favicon, voire sur rien. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CORRECTORS" />
    <meta property="og:title" content="CORRECTORS — corriger vos copies, préparer vos cours" />
    <meta property="og:description" content="Onze correcteurs par matière, assistés par IA, avec vos propres clés API. Demandez un accès à la bêta." />
    <meta property="og:image" content="/og-corrector.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Coq pixel-art bleu-blanc-rouge à côté du mot CORRECTORS" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
