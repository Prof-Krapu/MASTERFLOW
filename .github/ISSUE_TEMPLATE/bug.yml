name: Bug
description: Signaler un comportement reproductible.
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Couche
      options:
        - Component Lab
        - Prototype UI
        - Frontend runtime
        - Backend
        - MASTERBUILD
        - Inconnue
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction minimale
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Attendu et obtenu
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Preuve utile
      description: Capture, log court ou fichier concerné.
